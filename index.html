<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}</style>
<title>Brainiee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Hanken+Grotesk:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: sidebar of areas + one working column; bottom tab bar and floating add button on phones. */
:root{
  --bg:#f2f3f0; --surface:#ffffff; --surface2:#e9ebe6; --line:#d9dcd5; --fg:#14171a; --muted:#6a7077;
  --accent:#3b49df; --accent-fg:#ffffff; --accent-soft:#e3e6ff;
  --good:#12805c; --warn:#b36b00; --bad:#c23b2a;
  --display:"Bricolage Grotesque","Hanken Grotesk",system-ui,sans-serif;
  --body:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --shadow:0 12px 40px rgba(20,23,26,.18);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1013; --surface:#171a1f; --surface2:#20242a; --line:#2b3037; --fg:#eceef0; --muted:#9097a0;
    --accent:#8c96ff; --accent-fg:#0e1013; --accent-soft:#232744;
    --good:#4fcf9f; --warn:#e6a23c; --bad:#ff7d6b; --shadow:0 12px 40px rgba(0,0,0,.6); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1013; --surface:#171a1f; --surface2:#20242a; --line:#2b3037; --fg:#eceef0; --muted:#9097a0;
  --accent:#8c96ff; --accent-fg:#0e1013; --accent-soft:#232744;
  --good:#4fcf9f; --warn:#e6a23c; --bad:#ff7d6b; --shadow:0 12px 40px rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.mono{font-family:var(--mono)}
.muted{color:var(--muted)}
#app{height:100%;display:grid;grid-template-columns:268px minmax(0,1fr)}
aside{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 10px;font:700 20px var(--display)}
.brand i{width:26px;height:26px;border-radius:8px;background:var(--accent);display:grid;place-items:center;color:var(--accent-fg);font-style:normal;font-size:15px}
.side-scroll{overflow:auto;flex:1;padding:6px 10px 12px;min-height:0}
.search{margin:4px 8px 10px;display:flex;align-items:center;gap:8px;background:var(--surface2);border-radius:10px;padding:0 10px}
.search input{flex:1;min-width:0;background:none;border:0;height:36px;outline:0}
.nav-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:8px 10px;border-radius:9px;color:var(--fg);min-width:0}
.nav-btn:hover{background:var(--surface2)}
.nav-btn.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-btn .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.count{font:500 12px var(--mono);color:var(--muted)}
.side-h{display:flex;align-items:center;justify-content:space-between;padding:14px 10px 4px;font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.sub{padding-left:22px}
.status{padding:10px 18px;font:400 12px var(--mono);color:var(--muted);border-top:1px solid var(--line)}
main{overflow:auto;min-width:0;min-height:0;display:flex;flex-direction:column}
.page{padding:22px clamp(16px,3.2vw,36px) 120px;max-width:1100px;width:100%}
.page.wide{max-width:none}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.head h1{font-size:clamp(26px,4vw,36px);line-height:1.1}
.crumbs{font:500 12px var(--mono);color:var(--muted);margin-bottom:6px;display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center}
.crumbs button{color:var(--muted);text-decoration:underline;text-underline-offset:3px}
.btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:10px;background:var(--surface2);font-weight:500;white-space:nowrap}
.btn:hover{background:var(--line)}
.btn.pri{background:var(--accent);color:var(--accent-fg)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad);color:#fff}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;color:var(--muted)}
.icon-btn:hover{background:var(--surface2);color:var(--fg)}
.seg{display:inline-flex;background:var(--surface2);border-radius:11px;padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{padding:5px 12px;border-radius:8px;font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:26px 0 10px}
.sec-h h2{font-size:19px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.area-card{padding:16px;min-width:0}
.area-card h3{font-size:17px;display:flex;align-items:center;gap:8px}
.area-card ul{list-style:none;margin:10px 0 0;padding:0;display:grid;gap:2px}
.area-card li button{width:100%;text-align:left;padding:6px 8px;border-radius:8px;display:flex;justify-content:space-between;gap:8px}
.area-card li button:hover{background:var(--surface2)}
.rows{display:grid;gap:8px}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;width:100%;text-align:left;min-width:0}
.row:hover{border-color:var(--accent)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .m{font-size:12.5px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 10px;margin-top:2px}
.row.done .t{text-decoration:line-through;color:var(--muted)}
.chk-btn{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:transparent}
.chk-btn:hover{border-color:var(--accent)}
.chk-btn.on{background:var(--good);border-color:var(--good);color:#fff}
.chk-btn.p1{border-color:#6aa3d6}.chk-btn.p2{border-color:var(--warn)}.chk-btn.p3{border-color:var(--bad)}
.chk-btn.on{border-color:var(--good)}
.chk-btn svg{width:13px;height:13px;stroke-width:3}
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:99px;background:var(--surface2);font-size:12px}
.pill.bad{color:var(--bad)}.pill.warn{color:var(--warn)}.pill.tag{background:var(--accent-soft);color:var(--accent)}
.badge{width:38px;height:38px;border-radius:9px;background:var(--surface2);display:grid;place-items:center;font:500 11px var(--mono);flex:none;overflow:hidden;color:var(--muted)}
.badge img{width:100%;height:100%;object-fit:cover}
.empty{padding:26px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:14px}
.folders{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.folder{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.folder:hover{border-color:var(--accent)}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 14px;border-radius:12px;background:var(--accent-soft);color:var(--fg);margin-bottom:18px;font-size:14px}
.two{display:grid;grid-template-columns:minmax(0,1fr);gap:0 22px}
@media(min-width:980px){.two{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}}
.bottomnav{display:none}
.fab{position:fixed;right:24px;bottom:24px;width:56px;height:56px;border-radius:18px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;box-shadow:var(--shadow);z-index:20}
.fab svg{width:26px;height:26px;stroke-width:2.2}
@media(max-width:860px){
  #app{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto}
  aside{display:none}
  .bottomnav{display:flex;border-top:1px solid var(--line);background:var(--surface);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .bottomnav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 0;position:relative}
  .bottomnav button.on{color:var(--accent);font-weight:600}
  .bottomnav .badge-n{position:absolute;top:0;left:56%;background:var(--accent);color:var(--accent-fg);border-radius:99px;font-size:10px;min-width:16px;padding:0 4px}
  .fab{right:16px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:54px;height:54px}
  .page{padding-bottom:140px}
}
/* sheets */
#sheet{position:fixed;inset:0;z-index:50;background:rgba(10,12,16,.5);display:flex;align-items:center;justify-content:center;padding:16px}
#sheet .panel{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);width:min(640px,100%);max-height:min(88vh,100%);display:flex;flex-direction:column;overflow:hidden}
#sheet .panel.sm{width:min(420px,100%)}
@media(max-width:600px){#sheet{align-items:flex-end;padding:0}#sheet .panel{border-radius:18px 18px 0 0;max-height:92%;padding-bottom:env(safe-area-inset-bottom,0px)}}
.sh-head{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
.sh-head .tt{flex:1;font:700 16px var(--display);display:flex;gap:8px;align-items:center;min-width:0}
.sh-body{padding:16px;overflow:auto;display:grid;gap:14px;min-height:0}
.fld{display:grid;gap:5px;min-width:0}
.fld>label,.lbl{font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.inp,select.inp,textarea.inp{width:100%;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;outline:0}
.inp:focus{border-color:var(--accent)}
textarea.inp{resize:vertical;min-height:70px}
.title-inp{font:700 22px var(--display);padding:8px 2px;border:0;border-bottom:1px solid var(--line);border-radius:0;background:none}
.r2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips .pill button{display:grid;place-items:center;opacity:.7}
.sub-row{display:flex;align-items:center;gap:10px;padding:4px 0}
.sub-row input[type=text]{flex:1;min-width:0;background:none;border:0;border-bottom:1px solid transparent;padding:4px 0;outline:0}
.sub-row input[type=text]:focus{border-bottom-color:var(--accent)}
.sub-row.done input[type=text]{text-decoration:line-through;color:var(--muted)}
.sw{display:flex;gap:8px}
.sw button{width:26px;height:26px;border-radius:50%;border:2px solid transparent}
.sw button.on{border-color:var(--fg)}
.type-tabs{display:flex;gap:6px;flex-wrap:wrap}
.type-tabs button{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:10px;background:var(--surface2);font-weight:500;font-size:14px}
.type-tabs button.on{background:var(--accent);color:var(--accent-fg)}
.sh-foot{display:flex;gap:8px;justify-content:space-between;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.tb{display:flex;flex-wrap:wrap;gap:4px;padding:6px;background:var(--surface2);border-radius:10px 10px 0 0}
.tb button{min-width:32px;height:30px;padding:0 8px;border-radius:7px;font-weight:600;font-size:13px}
.tb button:hover{background:var(--line)}
.rte{min-height:220px;max-height:46vh;overflow:auto;border:1px solid var(--line);border-top:0;border-radius:0 0 10px 10px;padding:12px 14px;outline:0;background:var(--bg);line-height:1.6}
.rte h2{font-size:21px;margin:.4em 0}.rte h3{font-size:17px;margin:.4em 0}
.rte pre{font-family:var(--mono);font-size:13px;background:var(--surface2);padding:10px 12px;border-radius:8px;overflow:auto;white-space:pre-wrap}
.rte img{max-width:100%;border-radius:8px}
.rte a{color:var(--accent)}
.rte .chk{display:flex;gap:8px;align-items:flex-start}
.link-row{display:flex;gap:8px;padding:6px;background:var(--surface2)}
.linked{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:9px;background:var(--bg);border:1px solid var(--line)}
.linked button.open{flex:1;text-align:left;display:flex;gap:8px;align-items:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.preview{max-width:100%;max-height:300px;border-radius:10px;border:1px solid var(--line);justify-self:start}
/* toasts */
#toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(12px + env(safe-area-inset-top,0px));z-index:80;display:grid;gap:8px;width:min(420px,calc(100% - 32px))}
.toast{background:var(--fg);color:var(--bg);padding:11px 14px;border-radius:12px;box-shadow:var(--shadow);display:flex;gap:10px;align-items:center;justify-content:space-between;font-size:14px}
.toast button{font-weight:600;text-decoration:underline}
/* calendar */
.cal-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.cal-bar h1{font-size:clamp(22px,3.4vw,30px);flex:1;min-width:140px}
.cal-wrap{flex:1;min-height:0;display:flex;flex-direction:column;padding:18px clamp(16px,3.2vw,36px) 0}
.cal-scroll{flex:1;min-height:360px;overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-bottom:86px;position:relative}
.cal-inner{min-width:var(--minw,0)}
.cal-head,.cal-allday{display:grid;grid-template-columns:48px repeat(var(--n),minmax(0,1fr));position:sticky;background:var(--surface);z-index:5}
.cal-head{top:0;border-bottom:1px solid var(--line)}
.cal-allday{top:51px;border-bottom:1px solid var(--line);font-size:12px}
.dh{padding:8px 4px;text-align:center;border-left:1px solid var(--line);font-size:12px;color:var(--muted)}
.dh b{display:block;font:700 20px var(--display);color:var(--fg)}
.dh.today b{color:var(--accent)}
.ad{border-left:1px solid var(--line);padding:3px;display:grid;gap:2px;min-height:26px;align-content:start}
.ad span{display:block;font-size:11.5px;padding:1px 6px;border-radius:6px;border:1px dashed var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-body{display:grid;grid-template-columns:48px repeat(var(--n),minmax(0,1fr));position:relative;user-select:none;-webkit-user-select:none}
.gut{position:relative}
.gut span{position:absolute;right:6px;transform:translateY(-50%);font:400 10.5px var(--mono);color:var(--muted)}
.col{position:relative;border-left:1px solid var(--line);background-image:linear-gradient(var(--line) 1px,transparent 1px);background-size:100% var(--hh);cursor:crosshair}
.col.today{background-color:color-mix(in srgb,var(--accent) 5%,transparent)}
.ev{position:absolute;border-radius:8px;padding:3px 6px;font-size:12px;line-height:1.25;overflow:hidden;cursor:grab;border-left:4px solid var(--c);background:color-mix(in srgb,var(--c) 20%,var(--surface));touch-action:manipulation}
.ev.dragging{opacity:.85;box-shadow:var(--shadow);z-index:9;cursor:grabbing}
.ev b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev .tm{font:400 10.5px var(--mono);color:var(--muted)}
.ev .rs{position:absolute;left:0;right:0;bottom:0;height:8px;cursor:ns-resize}
.ghost{position:absolute;left:2px;right:2px;border-radius:8px;background:var(--accent-soft);border:2px dashed var(--accent);z-index:8;pointer-events:none}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--bad);z-index:6;pointer-events:none}
.nowline:before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--bad)}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-left:1px solid var(--line);border-top:1px solid var(--line);min-width:640px}
.mh{padding:6px;font:500 11px var(--mono);color:var(--muted);text-transform:uppercase;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center}
.mc{min-height:104px;padding:4px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0;align-items:stretch}
.mc:hover{background:var(--surface2)}
.mc.out{opacity:.45}
.mc .n{font-size:12px;font-weight:600;width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.mc.today .n{background:var(--accent);color:var(--accent-fg)}
.chip{font-size:11.5px;padding:1px 6px;border-radius:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-left:3px solid var(--c);background:color-mix(in srgb,var(--c) 20%,var(--surface))}
.chip.task{background:none;border:1px dashed var(--muted)}
.chip.more{background:none;border:0;color:var(--muted)}
.year{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px;padding:16px}
.mini h3{font-size:15px;margin-bottom:6px;text-align:left}
.mini h3 button:hover{color:var(--accent)}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-size:11px;text-align:center}
.mg b{font:500 9px var(--mono);color:var(--muted)}
.mg button{aspect-ratio:1;border-radius:6px;position:relative}
.mg button:hover{background:var(--surface2)}
.mg button.today{background:var(--accent);color:var(--accent-fg)}
.mg button.has:after{content:"";position:absolute;bottom:2px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent)}
.mg button.today.has:after{background:var(--accent-fg)}
@media (prefers-reduced-motion:no-preference){.panel{animation:rise .18s ease-out}@keyframes rise{from{transform:translateY(10px);opacity:0}}}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet" hidden></div>
<div id="toasts" aria-live="polite"></div>
<script>
(function(){
'use strict';
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TZ_LOCAL=(function(){try{return Intl.DateTimeFormat().resolvedOptions().timeZone||'UTC'}catch(e){return 'UTC'}})();
const COLORS=['#3b49df','#0f9d8a','#d9573b','#c28a00','#a83fb5','#2f7fc1'];
const HH=48; // px per hour
const DAY=864e5;
const IC={
 home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
 inbox:'<path d="M3 13h5l1 3h6l1-3h5"/><path d="M5 5h14l2 8v6H3v-6z"/>',
 cal:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
 grid:'<rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/>',
 folder:'<path d="M3 6h6l2 2h10v11H3z"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 task:'<circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/>',
 note:'<path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h7"/>',

function occurrences(ev,from,to){

  if(!ev.repeat||ev.repeat==='none'){ if(ev.start<to&&ev.end>from) out.push({start:ev.start,end:ev.end}); return out; }
  const w=wallParts(ev.start,ev.tz), per={daily:DAY,weekly:7*DAY,monthly:28*DAY,yearly:365*DAY}[ev.repeat];
  let n=Math.max(0,Math.floor((from-ev.start)/per)-2);
  for(let k=0;k<4000;k++,n++){
    let y=w.y,m=w.m,d=w.d;
    if(ev.repeat==='daily'||ev.repeat==='weekly'){const t=new Date(Date.UTC(y,m-1,d+n*(ev.repeat==='daily'?1:7)));y=t.getUTCFullYear();m=t.getUTCMonth()+1;d=t.getUTCDate()}

    const s=wallToUtc(y,m,d,w.h,w.mi,ev.tz);
    if(s>=to)break;
    if(s+dur>from)out.push({start:s,end:s+dur});
  }
  return out;
}

function dayEvents(day){
  const from=day.getTime(),to=addDays(day,1).getTime(),out=[];
  itemsArr().forEach(i=>{if(i.type==='event')occurrences(i,from,to).forEach(o=>out.push({it:i,start:o.start,end:o.end}))});
  return out.sort((a,b)=>a.start-b.start);
}
function timeGrid(){
  const v=CAL.view,n=v==='day'?1:v==='3day'?3:7,s=v==='week'?startOfWeek(CAL.date):new Date(CAL.date.getFullYear(),CAL.date.getMonth(),CAL.date.getDate());
  const days=[...Array(n).keys()].map(k=>addDays(s,k));
  const today=ymd(new Date());
  let head='<div class="cal-head" style="--n:'+n+'"><div></div>'+days.map(d=>'<div class="dh'+(ymd(d)===today?' today':'')+'">'+fmtDate(d,{weekday:'short'})+'<b>'+d.getDate()+'</b></div>').join('')+'</div>';
  let ad='<div class="cal-allday" style="--n:'+n+'"><div class="lbl" style="padding:6px 4px;font-size:9px;text-align:right">Due</div>'+days.map(d=>'<div class="ad">'+itemsArr().filter(i=>i.type==='task'&&i.due===ymd(d)).map(t=>'<span data-act="open" data-id="'+t.id+'" style="'+(t.done?'text-decoration:line-through;opacity:.6':'')+'">'+esc(t.title)+'</span>').join('')+'</div>').join('')+'</div>';
  let gut='<div class="gut" style="height:'+(24*HH)+'px">'+[...Array(23).keys()].map(h=>'<span style="top:'+((h+1)*HH)+'px">'+new Date(2000,0,1,h+1).toLocaleTimeString([], {hour:'numeric'})+'</span>').join('')+'</div>';
  const cols=days.map(d=>{
    const evs=dayEvents(d),day0=d.getTime();
    // lane layout
    evs.forEach(e=>{e.s=Math.max(e.start,day0);e.e=Math.min(e.end,day0+DAY)});
    let cluster=[],clusterEnd=0;const groups=[];
    evs.forEach(e=>{if(cluster.length&&e.s>=clusterEnd){groups.push(cluster);cluster=[];clusterEnd=0}cluster.push(e);clusterEnd=Math.max(clusterEnd,e.e)});
    if(cluster.length)groups.push(cluster);
    groups.forEach(g=>{const lanes=[];g.forEach(e=>{let l=lanes.findIndex(x=>x<=e.s);if(l<0){l=lanes.length;lanes.push(0)}lanes[l]=e.e;e.lane=l});g.forEach(e=>e.lanes=lanes.length)});
    const html=evs.map(e=>{
      const top=(e.s-day0)/36e5*HH,h=Math.max(20,(e.e-e.s)/36e5*HH-2);
      return '<div class="ev" tabindex="0" role="button" data-id="'+e.it.id+'" data-occ="'+e.start+'" data-end="'+e.end+'" style="--c:'+e.it.color+';top:'+top+'px;height:'+h+'px;left:calc('+(e.lane/e.lanes*100)+'% + 2px);width:calc('+(100/e.lanes)+'% - 4px)"><b>'+esc(e.it.title||'Event')+(e.it.repeat!=='none'?' ⟳':'')+'</b><span class="tm">'+fmtTime(e.start)+'</span><div class="rs"></div></div>';
    }).join('');
    const isT=ymd(d)===today;const nowMs=Date.now();
    const nl=isT?'<div class="nowline" style="top:'+((nowMs-day0)/36e5*HH)+'px"></div>':'';
    return '<div class="col'+(isT?' today':'')+'" data-day="'+ymd(d)+'" style="height:'+(24*HH)+'px">'+html+nl+'</div>';
  }).join('');
  const minw=n===1?0:n===3?420:660;
  return '<div class="cal-inner" style="--minw:'+minw+'px;--hh:'+HH+'px">'+head+ad+'<div class="cal-body" style="--n:'+n+'">'+gut+cols+'</div></div>';
}
function monthGrid(){
  const first=new Date(CAL.date.getFullYear(),CAL.date.getMonth(),1),s=startOfWeek(first),today=ymd(new Date());
  let h='<div class="month">'+['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>'<div class="mh">'+x+'</div>').join('');
  for(let k=0;k<42;k++){
    const d=addDays(s,k),evs=dayEvents(d),tasks=itemsArr().filter(i=>i.type==='task'&&i.due===ymd(d)&&!i.done);
    const chips=evs.map(e=>'<span class="chip" style="--c:'+e.it.color+'">'+esc(e.it.title)+'</span>').concat(tasks.map(t=>'<span class="chip task">'+esc(t.title)+'</span>'));
    h+='<button class="mc'+(d.getMonth()!==first.getMonth()?' out':'')+(ymd(d)===today?' today':'')+'" data-act="calday" data-d="'+ymd(d)+'"><span class="n">'+d.getDate()+'</span>'+chips.slice(0,3).join('')+(chips.length>3?'<span class="chip more">+'+(chips.length-3)+' more</span>':'')+'</button>';
  }

function yearGrid(){
  const y=CAL.date.getFullYear(),today=ymd(new Date());
  const busy=new Set();
  itemsArr().forEach(i=>{
    if(i.type==='task'&&i.due&&i.due.startsWith(y+'-'))busy.add(i.due);
    if(i.type==='event')occurrences(i,new Date(y,0,1).getTime(),new Date(y+1,0,1).getTime()).forEach(o=>busy.add(ymd(new Date(o.start))));
  });
  let h='<div class="year">';
  for(let m=0;m<12;m++){
    const f=new Date(y,m,1),lead=(f.getDay()+6)%7,dim=new Date(y,m+1,0).getDate();
    h+='<div class="mini"><h3><button data-act="calmonth" data-d="'+ymd(f)+'">'+fmtDate(f,{month:'long'})+'</button></h3><div class="mg">'+['M','T','W','T','F','S','S'].map(x=>'<b>'+x+'</b>').join('')+'<span></span>'.repeat(lead);
    for(let d=1;d<=dim;d++){const k=ymd(new Date(y,m,d));h+='<button class="'+(k===today?'today ':'')+(busy.has(k)?'has':'')+'" data-act="calday" data-d="'+k+'">'+d+'</button>'}
    h+='</div></div>';
  }

    if(cur==='link')f.innerHTML='<div class="fld"><label for="q-in">Paste a link</label><input id="q-in" class="inp" type="url" autofocus placeholder="https://"></div>';
    else if(cur==='file')f.innerHTML='<div class="fld"><label for="q-file">Choose a file</label><input id="q-file" type="file" class="inp"><span class="muted" style="font-size:12.5px">Photos are compressed. Other files can be up to about 150 KB.</span></div>';
    else f.innerHTML='<div class="fld"><label for="q-in">'+TNAME[cur]+' title</label><input id="q-in" class="inp" autofocus placeholder="'+(cur==='task'?'What needs doing?':cur==='note'?'Note title':'Event title')+'"></div>';
    const i=$('#q-in',p);if(i){i.focus();i.addEventListener('keydown',e=>{if(e.key==='Enter')add()})}
    pending=null;
  };
  const add=async()=>{
    const par=valToParent($('#q-where',p).value);let it;
    if(cur==='file'){
      const f=$('#q-file',p).files[0];if(!f){toast('Choose a file first');return}
      try{it=await makeFile(f,par)}catch(e){toast(e.message==='toobig'?'That file is too large to store here (limit about 150 KB).':'Could not read that file');return}
    }else{
      const v=($('#q-in',p).value||'').trim();
      if(cur==='link'){if(!v){toast('Paste a link first');return}const u=/^https?:\/\//i.test(v)?v:'https://'+v;it=mkItem('link',{url:u,title:hostOf(u),autoTitle:true,parent:par})}
      else{
        if(!v){toast('Add a title first');return}
        if(cur==='event'){const base=CAL.view?new Date(CAL.date):new Date(),now=new Date();const st=new Date(base.getFullYear(),base.getMonth(),base.getDate(),Math.min(23,now.getHours()+1),0).getTime();it=mkItem('event',{title:v,parent:par,start:st,end:st+36e5})}
        else it=mkItem(cur,{title:v,parent:par});
      }
    }
    addItem(it);sheetClose=null;$('#sheet').hidden=true;$('#sheet').innerHTML='';render();
    if(cur==='task'||cur==='link'||cur==='file')toast(TNAME[cur]+' added','Edit',()=>openItem(it.id));else openItem(it.id,false);
  };
  $('#qt',p).addEventListener('click',e=>{const b=e.target.closest('button');if(b){cur=b.dataset.t;draw()}});
  $('#q-add',p).onclick=add;draw();
}
async function makeFile(f,par){
  const img=f.type.startsWith('image/');let data,thumb='',size=f.size,mime=f.type||'application/octet-stream';
  if(img){data=await compressImage(f,1200,.75,190000);thumb=await compressImage(f,120,.6,0);mime='image/jpeg';size=Math.round(data.length*.75)}
  else{
    if(f.size>150*1024)throw new Error('toobig');
    data=await new Promise((r,j)=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.onerror=j;fr.readAsDataURL(f)});
  }
  return mkItem('file',{title:f.name,name:f.name,size:size,mime:mime,data:data,thumb:thumb,parent:par});
}
/* ---------- global actions ---------- */
function go(v){VIEW=v;render();const m=$('main');if(m)m.scrollTop=0}
function armedConfirm(btn,label,fn){
  if(btn.dataset.armed){fn();return}
  btn.dataset.armed='1';const old=btn.textContent;btn.classList.add('armed');btn.textContent='Click again to delete';
  setTimeout(()=>{if(btn.isConnected){delete btn.dataset.armed;btn.classList.remove('armed');btn.textContent=old}},3500);
}
function completeTask(it){
  if(!it.done&&it.repeat!=='none'&&it.due){
    const d=parseYmd(it.due);
    if(it.repeat==='daily')d.setDate(d.getDate()+1);else if(it.repeat==='weekly')d.setDate(d.getDate()+7);else{const day=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+1);d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()))}
    it.due=ymd(d);it.subtasks.forEach(s=>s.d=false);touch(it);toast('Done. Next one is due '+dueLabel(it.due)+'.');
  }else{it.done=!it.done;touch(it)}
}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||e.target.closest('#sheet .panel')&&!b.closest('.panel [data-act]'))return;
  const a=b.dataset.act,id=b.dataset.id;
  if(a==='toggle'){e.stopPropagation();const it=ITEMS[id];if(it){completeTask(it);render()}return}
  if(a==='open'){if(e.target.closest('.chk-btn'))return;openItem(id);return}
  if(a==='nav'){const v=b.dataset.v;go(v==='calendar'?{name:'calendar'}:{name:v});return}
  if(a==='area'){if(id)go({name:'area',id:id});return}
  if(a==='project'){go({name:'project',id:id,f:null,tab:VIEW.name==='project'&&VIEW.id===id?VIEW.tab:'all'});return}
  if(a==='folder'){go({name:'project',id:VIEW.id,f:id,tab:VIEW.tab||'all'});return}
  if(a==='ptab'){VIEW.tab=b.dataset.tab;render();return}
  if(a==='tag'){go({name:'tag',id:id});return}
  if(a==='inbox-f'){VIEW.f=b.dataset.f;render();return}
  if(a==='quick'){quickAdd(b.dataset.t);return}
  if(a==='newarea'){nameSheet('New area','',v=>{S.areas.push({id:uid(),name:v,color:COLORS[S.areas.length%COLORS.length]});markS()});return}
  if(a==='newproject'){nameSheet('New project','',v=>{const p={id:uid(),areaId:id,name:v};S.projects.push(p);markS();go({name:'project',id:p.id,f:null,tab:'all'})});return}
  if(a==='newfolder'){nameSheet('New folder','',v=>{S.folders.push({id:uid(),projectId:VIEW.id,parentId:VIEW.f||null,name:v});markS()});return}
  if(a==='renamearea'){nameSheet('Rename area',area(id).name,v=>{area(id).name=v;markS()});return}
  if(a==='renameproject'){nameSheet('Rename project',proj(id).name,v=>{proj(id).name=v;markS()});return}
  if(a==='renamefolder'){nameSheet('Rename folder',fold(id).name,v=>{fold(id).name=v;markS()});return}
  if(a==='areacolor'){area(id).color=b.dataset.c;markS();render();return}
  if(a==='delarea')return armedConfirm(b,'',()=>{
    const pids=S.projects.filter(p=>p.areaId===id).map(p=>p.id);pids.forEach(pid=>dropProject(pid));S.areas=S.areas.filter(x=>x.id!==id);markS();go({name:'browse'});toast('Area deleted. Its items moved to the Inbox.')});
  if(a==='delproject')return armedConfirm(b,'',()=>{const aid=proj(id).areaId;dropProject(id);markS();go({name:'area',id:aid});toast('Project deleted. Its items moved to the Inbox.')});
  if(a==='delfolder')return armedConfirm(b,'',()=>{const f=fold(id);const kill=new Set([id]);let ch=true;while(ch){ch=false;S.folders.forEach(x=>{if(x.parentId&&kill.has(x.parentId)&&!kill.has(x.id)){kill.add(x.id);ch=true}})}
    itemsArr().forEach(i=>{if(i.parent&&i.parent.f&&kill.has(i.parent.f)){i.parent={p:i.parent.p,f:f.parentId||null};touch(i)}});
    S.folders=S.folders.filter(x=>!kill.has(x.id));markS();go({name:'project',id:VIEW.id,f:f.parentId||null,tab:VIEW.tab||'all'});toast('Folder deleted. Its items moved up one level.')});
  if(a==='deltag')return armedConfirm(b,'',()=>{itemsArr().forEach(i=>{if(i.tags.includes(id)){i.tags=i.tags.filter(x=>x!==id);touch(i)}});S.tags=S.tags.filter(t=>t.id!==id);markS();go({name:'browse'})});
  if(a==='clearex'){const ids=itemsArr().filter(i=>i.example).map(i=>i.id);ids.forEach(removeItem);
    const keepP=new Set(itemsArr().filter(i=>i.parent).map(i=>i.parent.p));
    S.folders=S.folders.filter(f=>keepP.has(f.projectId));S.projects=S.projects.filter(p=>keepP.has(p.id));
    const keepA=new Set(S.projects.map(p=>p.areaId));S.areas=S.areas.filter(a=>keepA.has(a.id));
    const used=new Set(itemsArr().flatMap(i=>i.tags));S.tags=S.tags.filter(t=>used.has(t.id));markS();render();toast('Examples removed');return}
  if(a==='calnav'){const d=+b.dataset.d,v=CAL.view,c=CAL.date;
    CAL.date=v==='month'?new Date(c.getFullYear(),c.getMonth()+d,1):v==='year'?new Date(c.getFullYear()+d,c.getMonth(),1):addDays(c,d*(v==='day'?1:v==='3day'?3:7));render();return}
  if(a==='caltoday'){CAL.date=new Date();render();return}
  if(a==='calview'){CAL.view=b.dataset.v;render();return}
  if(a==='calday'){CAL.date=parseYmd(b.dataset.d);CAL.view='day';render();return}
  if(a==='calmonth'){CAL.date=parseYmd(b.dataset.d);CAL.view='month';render();return}
});
function dropProject(pid){
  itemsArr().forEach(i=>{if(i.parent&&i.parent.p===pid){i.parent=null;touch(i)}});
  S.folders=S.folders.filter(f=>f.projectId!==pid);S.projects=S.projects.filter(p=>p.id!==pid);
}
document.addEventListener('change',e=>{
  const m=e.target.closest('[data-move]');if(m){const it=ITEMS[m.dataset.move];if(it){it.parent=valToParent(m.value);touch(it);render();toast('Moved to '+placeLabel(it.parent))}}
});
document.addEventListener('input',e=>{
  if(e.target.id==='q'||e.target.id==='q2'){const v=e.target.value;if(!v.trim()&&VIEW.name!=='search')return;VIEW={name:'search',q:v};render();const q=$('#q');if(q){q.focus();q.setSelectionRange(v.length,v.length)}}
});
/* ---------- reminders (shown while the page is open) ---------- */
function checkReminders(){
  const now=Date.now();
  itemsArr().forEach(i=>{
    if(i.reminder==null)return;let when=null,label='';
    if(i.type==='task'&&!i.done&&i.due){when=parseYmd(i.due).getTime()+((i.time?(+i.time.slice(0,2)*36e5+(+i.time.slice(3,5))*6e4):9*36e5));label='due '+dueLabel(i.due)+(i.time?' at '+i.time:'')}
    if(i.type==='event'){const o=occurrences(i,now-DAY,now+3*DAY).find(o=>o.start-i.reminder*6e4<=now&&o.start+36e5>now);if(o){when=o.start;label='at '+fmtTime(o.start)}}
    if(when==null)return;
    const fire=when-i.reminder*6e4;
    if(fire<=now&&now-fire<12*36e5){
      const key=i.id+'@'+when;
      if(!reminded[key]){reminded[key]=1;try{localStorage.setItem('brainiee.fired',JSON.stringify(reminded))}catch(e){}toast(i.title+' '+label,'Open',()=>openItem(i.id))}
    }
  });
}
/* ---------- boot ---------- */
(async function boot(){
  $('#app').innerHTML='<main style="grid-column:1/-1"><div class="page"><div class="muted mono">Loading your second brain…</div></div></main>';
  await loadAll();
  if(!S.seeded&&!itemsArr().length&&!S.areas.length)seed();
  S.seeded=true;
  render();
  setStatus(store.label||'');
  setTimeout(checkReminders,1500);setInterval(checkReminders,30000);
})();
})();
</script>
